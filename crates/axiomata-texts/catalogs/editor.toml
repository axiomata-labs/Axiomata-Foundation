# The texts of the file app and its editor UI (`fileapp/*.svelte` and the helpers whose words they show). The editor
# engine (`editor/`) imports nothing from the app; its own messages (Vi's `E486: …`, the find counts) have their
# catalog in `editorEngine.ts`. Vi's mode names, key chords, command names and what a language server sends stay as
# they are (`docs/plans/i18n.md`, Q13). A text that wraps a highlighted piece is split around it (`…Before` / `…After`), so
# German may place the piece where its word order needs it.

