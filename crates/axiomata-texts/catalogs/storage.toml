de = "Räume auf…"

[cleanNow]
en = "Clean up now"
de = "Jetzt aufräumen"

[saveFirst]
en = "Save the rules first: “Clean up now” cleans by the saved ones."
de = "Speichere zuerst die Regeln: „Jetzt aufräumen“ räumt nach den gespeicherten auf."

[endedToRemove]
en = "Ended sessions a clean-up removes"
de = "Beendete Sitzungen, die ein Aufräumen entfernt"

[endedRemoved]
en = "Ended sessions removed"
de = "Entfernte beendete Sitzungen"

[endedHint]
en = "Sessions whose harness ended days ago with no work of their own — nothing uncommitted, no commit beyond their base, no open card. Their worktree and branch go with them; a session with work always stays."
de = "Sitzungen, deren Harness vor Tagen ohne eigene Arbeit endete — nichts Uncommittetes, kein Commit über ihre Basis hinaus, keine offene Karte. Ihr Worktree und ihr Branch gehen mit; eine Sitzung mit Arbeit bleibt immer."

[orphansTitle]
en = "Orphaned worktrees waiting for you"
de = "Verwaiste Worktrees, die auf dich warten"

[orphansHint]
en = "Their agent is gone, but they hold work nobody saved, so no clean-up removes them."
de = "Ihr Agent ist weg, aber sie enthalten Arbeit, die niemand gesichert hat, deshalb entfernt kein Aufräumen sie."

[unknownState]
en = "unknown state"
de = "Zustand unbekannt"

[deleteWorktree]
en = "Delete {path}"
de = "{path} löschen"

[backupsTitle]
en = "Backups of the old roles and engines"
de = "Backups der alten Rollen und Engines"

[backupsHint]
en = "The role copies and engines the move to roles at tiers put aside. Nothing uses them; delete one when you no longer need it."
de = "Die Rollen-Kopien und Engines, die der Umzug auf Rollen mit Stufen beiseitegelegt hat. Nichts nutzt sie; lösche eines, wenn du es nicht mehr brauchst."

[deleteBackup]
en = "Delete backup {path}"
de = "Backup {path} löschen"

# What the actions say.
[rulesSaved]
en = "Storage rules saved"
de = "Speicher-Regeln gespeichert"

[saveRulesFailed]
