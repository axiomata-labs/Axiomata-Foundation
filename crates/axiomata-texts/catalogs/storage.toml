# The texts of Settings → Storage (`shell/StorageSettings.svelte`) and of its helper (`core/maintenance.ts`). The
# report's rows come from Rust in English (`axiomata_core::maintenance`); they are named here by their fixed keys,
# and a row added later shows as the backend words it (`docs/plans/i18n.md`, Q11). Paths, Glut and Axiomata stay as
# they are (Q13).

[title]
en = "Storage"
de = "Speicher"

[lead]
en = "Axiomata cleans up its own data in {home} once a week at start. Your projects, the vault and Glut's own folder are never touched here."
de = "Axiomata räumt seine eigenen Daten in {home} einmal pro Woche beim Start auf. Deine Projekte, der Vault und Gluts eigener Ordner werden hier nie angefasst."

[measureError]
en = "Could not measure the storage: {error}"
de = "Der Speicher ließ sich nicht messen: {error}"

[measuring]
en = "Measuring…"
de = "Messe…"

[lastCleanup]
en = "Last clean-up"
de = "Letztes Aufräumen"

[never]
en = "never"
de = "nie"

[wouldFree]
en = "Would free"
de = "Würde freigeben"

[days]
en = "days"
de = "Tage"

[kept]
en = "kept"
de = "behalten"

[frees]
