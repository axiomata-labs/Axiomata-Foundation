de = "Die Regeln ließen sich nicht speichern: {error}"

[confirmCleanFrees]
en = "Clean up now? This frees about {size}. Worktrees with changes stay."
de = "Jetzt aufräumen? Das gibt etwa {size} frei. Worktrees mit Änderungen bleiben."

[confirmCleanNothing]
en = "Clean up now? Nothing is due right now; the database is still compacted if it needs it."
de = "Jetzt aufräumen? Gerade ist nichts fällig; die Datenbank wird trotzdem kompaktiert, wenn sie es braucht."

[cleaned]
en = "Cleaned up — {size} freed"
de = "Aufgeräumt — {size} freigegeben"

[cleanFailed]
