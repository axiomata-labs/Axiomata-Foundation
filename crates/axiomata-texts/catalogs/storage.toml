de = "Das Backup {path} löschen? Die alten Rollendateien und Engines darin sind endgültig weg."

[backupDeleted]
en = "Backup deleted"
de = "Backup gelöscht"

[backupDeleteFailed]
en = "Could not delete the backup: {error}"
de = "Das Backup ließ sich nicht löschen: {error}"

