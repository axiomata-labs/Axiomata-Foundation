# The texts of the day-to-day tiles: Calendar, Reminders, Mail, ToDo and Routines (`modules/calendar.svelte`,
# `modules/reminders.svelte`, `modules/mail.svelte`, `modules/todo.svelte`, `modules/routines-board.svelte`, their
# settings faces and parts) and of the helpers whose words they show (`core/skillRun.ts`' digest notes,
# `core/calendar.ts`, `core/mail.ts`, `core/routineInterval.ts`). Event titles, reminders, mail subjects and senders,
# todo items, skill names and cron strings are data and stay as they are; weekday and month names come from
# `core/format.ts`. A text that wraps a `<code>` piece is split around it (`…Before` / `…After`), so German may
# place the piece where its word order needs it.

