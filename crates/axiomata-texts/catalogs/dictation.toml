# The texts of dictation (`docs/plans/voice-browser.md` §12): the pill (`shell/DictationPill.svelte`), the chat bar's
# microphone and the Dictation section of Settings → Voice (`shell/DictationSettings.svelte`). The model's and the
# microphones' names stay as they are (`docs/plans/i18n.md`, Q13).

[title]
en = "Dictation"
de = "Diktat"

[lead]
en = "Speak into any text field of Axiomata — the chat, a note, a card, the editor. Whisper recognises it on this Mac; the audio is never stored. Say “new line” or “new paragraph” for a break."
de = "Sprich in jedes Textfeld von Axiomata – den Chat, eine Notiz, eine Karte, den Editor. Whisper erkennt es auf diesem Mac; der Ton wird nie gespeichert. Sag „neue Zeile“ oder „neuer Absatz“ für einen Umbruch."

[key]
en = "Key"
de = "Taste"

[keyHint]
en = "Starts and ends a dictation. On an Apple keyboard F5 and F6 need fn, or “Use F1, F2, etc. keys as standard function keys” in the system settings."
de = "Startet und beendet ein Diktat. Auf einer Apple-Tastatur brauchen F5 und F6 fn dazu oder in den Systemeinstellungen „F1, F2 usw. als Standard-Funktionstasten verwenden“."

