# The help list beside the layout buttons.
[helpBundle]
en = "Every note on one ring, an arc per area, the newest first, clockwise. Links run through the middle, bundled along the folders, in the colour of the note they start from; the links of the last {days} days glow. Point at a note or an area to see its links. Skills ring it outside."
de = "Jede Notiz auf einem Ring, ein Bogen je Bereich, die neueste zuerst, im Uhrzeigersinn. Links laufen durch die Mitte, gebündelt entlang der Ordner, in der Farbe der Notiz, von der sie ausgehen; die Links der letzten {days} Tage glühen. Zeige auf eine Notiz oder einen Bereich, um seine Links zu sehen. Skills umringen ihn außen."

[helpMap]
en = "A map of the vault: every note a field, every area a country, the oldest notes at its heart. Links are roads (zoom in); close up every field shows its name. Skills ring the map."
de = "Eine Karte des Vault: jede Notiz ein Feld, jeder Bereich ein Land, die ältesten Notizen in seinem Kern. Links sind Straßen (zoome hinein); aus der Nähe zeigt jedes Feld seinen Namen. Skills umringen die Karte."

[helpHex]
en = "A honeycomb: every note its own hex cell, packed tight, each area in its own wedge, the newest nearest the middle. Skills and areas sit inside it."
de = "Eine Wabe: jede Notiz eine eigene Hex-Zelle, dicht gepackt, jeder Bereich in seinem eigenen Keil, die neuesten nah der Mitte. Skills und Bereiche liegen darin."

[helpAreas]
en = "One segment per top-level vault folder."
de = "Ein Segment je Ordner der obersten Vault-Ebene."

[helpFolders]
en = "One segment per deepest folder, e.g. Learning/Rust/lessons. A finer split of large areas; in Bundle the links bundle along the folder tree."
de = "Ein Segment je tiefstem Ordner, z. B. Learning/Rust/lessons. Eine feinere Teilung großer Bereiche; im Bündel bündeln sich die Links entlang des Ordnerbaums."

