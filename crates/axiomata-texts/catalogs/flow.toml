# The texts of the Studio's Flow mode and its planning: the Planning pane (`ide/panes/PlanPane.svelte`,
# `ide/panes/ProposalEditor.svelte`), the Agents tab (`ide/panes/TeamPane.svelte`, `ide/SessionMail.svelte`,
# `ide/AgentTeamEntry.svelte`), the Flow view (`ide/panes/GraphPane.svelte`) and the pure helpers whose words only they
# show (`ide/planning.ts`, `ide/flowGraph.ts`, `ide/team.ts`, `ide/agentEntry.ts`). Role, engine, tier and git names
# stay as they are (`docs/plans/i18n.md`, Q13).

# A plan's status, as the list and the header show it.
[statusDraft]
en = "draft"
de = "Entwurf"

[statusReleased]
en = "released"
de = "freigegeben"

[statusClosed]
en = "closed"
de = "geschlossen"

[cardFallback]
en = "Card #{id}"
de = "Karte #{id}"

[needs]
en = "needs {ids}"
de = "braucht {ids}"

# What the plans that run by themselves did, toast-sized (`planning.ts` `runEventNote`).
[eventStarted]
en = "Plan #{plan}: card #{card} starts by itself."
de = "Plan #{plan}: Karte #{card} startet von selbst."

[eventIntegrated]
en = "Card #{card} is integrated into plan #{plan}."
de = "Karte #{card} ist in Plan #{plan} integriert."

[eventGaveUp]
en = "Card #{card} does not fit the plan the second time either ({files}); it stays as it is. You decide."
de = "Karte #{card} passt auch beim zweiten Mal nicht in den Plan ({files}); sie bleibt, wie sie ist. Du entscheidest."

[eventRedo]
en = "Card #{card} no longer fit the plan ({files}) and will be redone on the new state."
de = "Karte #{card} passte nicht mehr in den Plan ({files}) und wird auf dem neuen Stand neu gemacht."

[eventBlocked]
en = "Card #{card} made no progress: {reason}"
de = "Karte #{card} kam nicht voran: {reason}"

[eventReady]
en = "The plan “{name}” is finished: all cards are integrated. Ready to take over."
de = "Der Plan „{name}“ ist fertig: alle Karten sind integriert. Bereit zum Übernehmen."

[eventEscalated]
en = "Card #{card} was returned twice: “{role}” on “{engine}” takes over from “{from}” (same worktree, same branch). If that does not work either, you decide."
de = "Karte #{card} kam zweimal zurück: „{role}“ auf „{engine}“ übernimmt von „{from}“ (gleicher Worktree, gleicher Branch). Klappt auch das nicht, entscheidest du."

[eventPaused]
en = "Plan “{name}” is paused: {reason}. Nothing new starts until you say “Continue” in the Flow."
de = "Plan „{name}“ ist pausiert: {reason}. Nichts Neues startet, bis du im Flow „Weiter“ sagst."

[eventDayCap]
en = "Daily limit of the Studio sessions reached ({reason}). Nothing new starts until tomorrow or until you raise it in the config."
de = "Tagesgrenze der Studio-Sitzungen erreicht ({reason}). Nichts Neues startet bis morgen oder bis du sie in der Config anhebst."

