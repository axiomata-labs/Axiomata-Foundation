# The texts of the chat bar (`shell/AssistantBar.svelte`, `shell/SlashPanel.svelte`, `shell/EffortSwitch.svelte`) and
# of its `/` commands (`core/commands.ts`, `core/slashLists.ts`, `core/effortLevels.ts`). Command names, model ids
# and effort levels are names and stay as they are (`docs/plans/i18n.md`, Q13).

# The commands, as the suggestion list and /help describe them.
[cmdHelp]
en = "List every command, or open a handbook page"
de = "Alle Kommandos zeigen oder eine Handbuchseite öffnen"

[cmdClear]
en = "Start a new conversation"
de = "Ein neues Gespräch beginnen"

[cmdCompact]
en = "Summarise the conversation so far to free context"
de = "Das bisherige Gespräch zusammenfassen und Platz schaffen"

[cmdModel]
en = "Show or change this conversation's model"
de = "Das Modell dieses Gesprächs zeigen oder wechseln"

[cmdEffort]
en = "Show or change how hard Glut's model reasons in this conversation"
de = "Zeigen oder ändern, wie gründlich Gluts Modell in diesem Gespräch nachdenkt"

[cmdPlan]
en = "Plan mode: the agent reads and plans, changes nothing"
de = "Plan-Modus: der Agent liest und plant, ändert nichts"

[cmdBuild]
en = "Build mode: the agent may carry the plan out"
de = "Build-Modus: der Agent darf den Plan umsetzen"

[cmdSkills]
en = "List the skills, or run one"
de = "Die Skills zeigen oder einen starten"

[cmdCost]
en = "Turns and money of this conversation"
de = "Schritte und Kosten dieses Gesprächs"

[cmdResume]
en = "List earlier conversations, or continue one"
de = "Frühere Gespräche zeigen oder eines fortsetzen"

[cmdUndo]
en = "Undo the file changes of the last turn"
de = "Die Dateiänderungen des letzten Schritts zurücknehmen"

[cmdDo]
en = "A one-shot instruction to the agent, outside the chat"
de = "Eine einmalige Anweisung an den Agenten, außerhalb des Chats"

[cmdTile]
en = "Tiles and their actions"
de = "Kacheln und ihre Aktionen"

[cmdTheme]
en = "Switch the theme"
de = "Das Theme wechseln"

[cmdOpen]
en = "Open a workspace file (.md or .html)"
de = "Eine Datei aus dem Workspace öffnen (.md oder .html)"

[cmdNewfile]
en = "Create an empty workspace file and open it"
de = "Eine leere Datei im Workspace anlegen und öffnen"

[cmdBrain]
en = "Open the Second Brain (on a file, or searching)"
de = "Das Second Brain öffnen (auf einer Datei oder mit Suche)"

