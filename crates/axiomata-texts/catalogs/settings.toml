[glassHint]
en = "Transparency: how much of the ground shows through the surfaces — 0% solid, 100% clear, 50% the theme's own look. Blur: how soft the ground is, and with it everything seen through the glass. The ground is the theme's own or your image, blurred once, so a softer one costs nothing while you work. Image dim: how strongly the theme's own ground veils your image — darker in a dark theme, lighter in a light one —, so text stays readable. Menus and text overlays stay dense either way, and macOS “Reduce transparency” makes all of it solid."
de = "Transparenz: wie viel vom Grund durch die Flächen scheint — 0 % deckend, 100 % klar, 50 % der eigene Look des Themes. Unschärfe: wie weich der Grund ist, und mit ihm alles, was man durchs Glas sieht. Der Grund ist der des Themes oder dein Bild, einmal weichgezeichnet, also kostet ein weicherer nichts, während du arbeitest. Bild abdunkeln: wie stark der Grund des Themes dein Bild verschleiert — dunkler in einem dunklen Theme, heller in einem hellen —, damit Text lesbar bleibt. Menüs und Text-Overlays bleiben so oder so dicht, und „Transparenz reduzieren“ von macOS macht alles deckend."

[reduceTransparencyOn]
en = "macOS “Reduce transparency” is on: the glass is solid now."
de = "„Transparenz reduzieren“ von macOS ist an: das Glas ist jetzt deckend."

