de = "Die Tag-Liste des Vault, abgelegt in {file}. Agenten taggen Notizen nur aus ihr; ein Tag, das sie wollen und das nicht darauf steht, wartet hier auf dich. Ziel: etwa 30–60 Tags, 1–4 pro Notiz."

