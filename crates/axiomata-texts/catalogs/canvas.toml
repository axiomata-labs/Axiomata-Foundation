# The texts of the canvas and what lives on it: the tiles' frame (`canvas/Tile.svelte`, `canvas/BackgroundHost.svelte`,
# `canvas/EmptyCanvas.svelte`), the module names the tiles and pickers show (`modules/index.ts`, read through
# `core/registry.ts` `moduleTitle`), the Terminal and Skills Deck tiles and their flip sides, the App Ring's dialogs,
# the `ui/` kit, the app root's notices (`App.svelte`) and the helpers whose words these show (`core/appGroups.ts`,
# `modules/bundledSkills.ts`). Skill names, app names, theme and font names, terminal output and command lines are
# data and stay as they are (`docs/plans/i18n.md`, Q13).

