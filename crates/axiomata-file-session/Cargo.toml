[package]
name = "axiomata-file-session"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "One open file in an editor: the version on disk it is based on, the banners a change from outside raises, unsaved text kept aside — and the jump history, the recently opened files and the kept folds around it. No editor and no I/O of its own: the text stays with the editor, the disk is a trait."

[dependencies]
serde.workspace = true
# Only for the Axiomata app's generated TypeScript types (feature `ts`).
ts-rs = { workspace = true, optional = true }

[features]
# Derive the TypeScript types of the views (Axiomata-OS `apps/axiomata/src-tauri/src/bindings.rs`).
ts = ["dep:ts-rs"]

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
