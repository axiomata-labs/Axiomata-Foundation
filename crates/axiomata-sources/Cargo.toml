[package]
name = "axiomata-sources"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "What an app of the Axiomata family may read on the Mac — calendars, reminders, files, mail — behind one fence: a fixed baseline no app can lift, and the owner's own list. Knows nothing of models."

[dependencies]
# The real place of an open file (`F_GETPATH`) and `O_NOFOLLOW`, as `axiomata-files` uses them.
rustix.workspace = true
# Mail's answers come back as JSON (`mail.rs`).
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDate", "NSArray", "NSEnumerator", "NSError", "NSCalendar", "NSPredicate", "NSData", "NSBundle"] }
# The apps that run, to quit one gently (`apps.rs`): no Apple events, no permission.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication"] }
objc2-event-kit = { version = "0.3", default-features = false, features = ["std", "block2", "EKEventStore", "EKEvent", "EKCalendarItem", "EKCalendar", "EKReminder", "EKSource", "EKTypes", "EKObject", "EKAlarm", "EKRecurrenceRule", "EKRecurrenceEnd"] }
objc2-pdf-kit = { version = "0.3", default-features = false, features = ["std", "PDFDocument", "PDFPage"] }
