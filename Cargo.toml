[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/axiomata-labs/Axiomata-Foundation"

# The versions as Axiomata-OS has them, so the apps built on these crates share one version of each.
[workspace.dependencies]
# The text catalogs of `axiomata-texts`, read by its build script only — in the file's order, so a catalog keeps the
# grouping its author gave it.
toml = { version = "0.8", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
ignore = "0.4"
regex = "1"
globset = "0.4"
# Encodes an image's raw bytes for `workspace::read_image` (inlined into the
# Markdown viewer as a `data:` URI — see that function's doc comment for why
# not `asset://`).
base64 = "0.22"
# `openat`/`renameat`/`unlinkat` for `axiomata-files`: every action walks from
# the root's directory fd with `O_NOFOLLOW`, so a directory swapped for a
# symlink between the guard's check and the action cannot redirect it (the
# TOCTOU the ED0.1 security audit found). Safe wrappers — no own `unsafe`.
# Already in the tree transitively; `fs` is the only module needed.
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }
# File-change events for `axiomata-files`' watcher (editor plan E5) —
# FSEvents on macOS. What an event *means* (modified/deleted/created, judged
# by content version after a debounce) is our own code in `watch.rs`.
notify = "8"
# Reading Messages' own store, `chat.db`, read only (`axiomata-sources::imessage`, Lirvel §8m S5b). The version
# Axiomata-OS and Lirvel use, bundled: one SQLite in every app built on these crates.
rusqlite = { version = "0.41", features = ["bundled"] }
# QuickJS for `axiomata-script`, as Glut's code mode pins it: `std` and `futures` for the async runtime a script's
# tool calls await in, `parallel` so the runtime is `Send` and a host may run it on any thread of its own.
rquickjs = { version = "0.14", default-features = false, features = ["std", "futures", "parallel"] }
# TypeScript's types stripped before QuickJS runs a script: the transform (with what it needs, semantic analysis and
# the printer) only — no minifier, no lowering.
oxc = { version = "0.159", default-features = false, features = ["transformer", "codegen", "semantic"] }
# A script's tool calls (channels), its watch and `wait` (timer), and `select!` between them; the host's runtime.
tokio = { version = "1.54", default-features = false, features = ["rt", "time", "sync", "macros"] }
# Plugins for `axiomata-plugin` (docs/plans/plugins.md): WebAssembly components with a WIT interface. Cranelift is in,
# because the app translates a plugin once at install into machine code; the component model's async ABI is compiled
# in for components that use it, but every call runs synchronously. No WASI beyond P2, nothing of the defaults the
# host does not need.
wasmtime = { version = "=50.0.2", default-features = false, features = ["runtime", "cranelift", "component-model", "component-model-async", "std", "parallel-compilation"] }
# WASI P2 with nothing granted: no folders, no network, no variables — what a guest's standard library imports must
# link, and only that.
wasmtime-wasi = { version = "=50.0.2", default-features = false, features = ["p2"] }
# Releases fetched from GitHub or a direct address at install and update: blocking HTTPS through rustls, as Hauch and
# Lirvel have it.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
# A plugin's checksum (its manifest names the SHA-256 of its `.wasm`) and the check of its compiled machine code.
sha2 = "0.10"
# A plugin's version and the interface version it was built against.
semver = { version = "1", features = ["serde"] }
# Random ids for `axiomata-dock`'s nodes, the version Axiomata-OS has.
getrandom = "0.3"
# TypeScript types the Axiomata app generates from the Rust ones (feature `ts` of a crate), as Axiomata-OS pins it.
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat", "no-serde-warnings"] }
